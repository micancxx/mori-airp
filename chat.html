<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>The Dangerous Lover · Mori</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 12% 0%,
          rgba(78, 43, 91, 0.20),
          transparent 34%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(74, 25, 45, 0.13),
          transparent 32%
        ),
        #070609;

      color: #e4d9e7;

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }

    .page {
      width: min(700px, 92%);
      margin: 0 auto;
      padding: 30px 0 120px;
    }

    .back {
      display: inline-block;

      margin-bottom: 45px;

      color: #9b79a5;

      font-size: 14px;

      text-decoration: none;
    }

    .back:hover {
      color: #c7b8cb;
    }

    .intro {
      margin-bottom: 42px;

      color: #817783;

      font-size: 13px;

      line-height: 1.6;

      text-align: center;
    }

    .name {
      display: block;

      margin-bottom: 7px;

      color: #e4d9e7;

      font-size: 27px;

      font-weight: 500;
    }

    #messages {
      display: flex;

      flex-direction: column;

      gap: 18px;
    }

    .message {
      display: flex;

      width: 100%;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;

      padding: 12px 15px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.6;
    }

    .message.ai .bubble {
      background: #151018;

      border: 1px solid #2b202f;

      color: #ddd1e0;

      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: #302039;

      border: 1px solid #49344f;

      color: #eee5f0;

      border-bottom-right-radius: 4px;
    }

    .input-area {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      padding: 15px 20px;

      background: rgba(7, 6, 9, 0.97);

      border-top: 1px solid #211a25;
    }

    .input-inner {
      display: flex;

      width: min(700px, 100%);

      margin: 0 auto;

      gap: 10px;
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      padding: 12px 14px;

      background: #0f0c12;

      border: 1px solid #302638;

      border-radius: 10px;

      outline: none;

      color: #e9e2ec;

      font-family: inherit;

      font-size: 14px;
    }

    #messageInput::placeholder {
      color: #625a65;
    }

    #messageInput:focus {
      border-color: #49344f;
    }

    #sendButton {
      padding: 0 18px;

      background: #392347;

      border: 1px solid #51315f;

      border-radius: 10px;

      color: #e9e2ec;

      font-family: inherit;

      cursor: pointer;
    }

    #sendButton:hover {
      background: #493055;
    }

    #sendButton:disabled {
      opacity: 0.55;

      cursor: wait;
    }

  </style>

</head>


<body>


  <main class="page">


    <a
      class="back"
      href="index.html"
    >
      ← Mori
    </a>


    <div class="intro">

      <span class="name">
        The Dangerous Lover
      </span>

      A new story begins here.

    </div>


    <div id="messages">


      <div class="message ai">

        <div class="bubble">
          You finally came.
        </div>

      </div>


      <div class="message user">

        <div class="bubble">
          Who are you?
        </div>

      </div>


      <div class="message ai">

        <div class="bubble">
          Someone you probably shouldn't trust.
        </div>

      </div>


    </div>


  </main>


  <div class="input-area">

    <div class="input-inner">


      <input
        id="messageInput"
        type="text"
        placeholder="Write a message..."
        autocomplete="off"
      >


      <button
        id="sendButton"
        type="button"
      >
        Send
      </button>


    </div>

  </div>


  <script>

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const messages =
      document.getElementById("messages");


    const API_URL =
      "https://mori-airp.onrender.com/chat";


    async function sendMessage() {

      const text =
        input.value.trim();


      if (!text) {
        return;
      }


      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user";


      const userBubble =
        document.createElement("div");

      userBubble.className =
        "bubble";

      userBubble.textContent =
        text;


      userMessage.appendChild(
        userBubble
      );

      messages.appendChild(
        userMessage
      );


      input.value = "";


      button.disabled = true;

      button.textContent = "...";


      const aiMessage =
        document.createElement("div");

      aiMessage.className =
        "message ai";


      const aiBubble =
        document.createElement("div");

      aiBubble.className =
        "bubble";

      aiBubble.textContent =
        "...";


      aiMessage.appendChild(
        aiBubble
      );

      messages.appendChild(
        aiMessage
      );


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: text
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Server error"
          );

        }


        aiBubble.textContent =
          data.reply;


      } catch (error) {

        console.error(
          "Mori error:",
          error
        );


        aiBubble.textContent =
          "Something went wrong. Please try again.";

      }


      button.disabled = false;

      button.textContent =
        "Send";

    }


    button.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>


</body>

</html>
