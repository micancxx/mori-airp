<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Mori · The Dangerous Lover</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(79, 39, 91, 0.20),
      transparent 35%
    ),

    radial-gradient(
      circle at 90% 80%,
      rgba(75, 25, 45, 0.14),
      transparent 35%
    ),

    #070609;

  color: #eee8ef;

  font-family:
    "Quicksand",
    sans-serif;
}


/* =========================
   TOP BAR
========================= */

.topbar {

  width: 100%;

  padding: 22px 6%;

  border-bottom:
    1px solid #211923;

  background:
    rgba(7, 6, 9, 0.92);

  backdrop-filter:
    blur(12px);
}

.back {

  color: #9e8da3;

  text-decoration: none;

  font-size: 14px;

  font-weight: 500;

  transition:
    color 0.2s ease;
}

.back:hover {

  color: #d5c4d9;
}


/* =========================
   CHAT CONTAINER
========================= */

.chat-container {

  width: 90%;

  max-width: 760px;

  margin:
    0 auto;

  min-height:
    calc(100vh - 74px);

  display: flex;

  flex-direction: column;
}


/* =========================
   INTRO
========================= */

.intro {

  padding:
    42px 0 30px;

  color: #756b78;

  font-size: 13px;

  line-height: 1.7;

  text-align: center;
}

.intro-name {

  display: block;

  margin-bottom: 5px;

  color: #d7cad9;

  font-size: 21px;

  font-weight: 600;
}


/* =========================
   MESSAGES
========================= */

.messages {

  flex: 1;

  padding-bottom:
    110px;
}

.message {

  display: flex;

  margin:
    16px 0;
}

.message.ai {

  justify-content: flex-start;
}

.message.user {

  justify-content: flex-end;
}


/* =========================
   BUBBLES
========================= */

.bubble {

  max-width: 75%;

  padding:
    13px 16px;

  border-radius: 15px;

  font-size: 14px;

  line-height: 1.65;
}

.message.ai .bubble {

  background:
    #120e15;

  border:
    1px solid #2b2130;

  color:
    #cfc3d2;

  border-top-left-radius:
    5px;
}

.message.user .bubble {

  background:
    linear-gradient(
      135deg,
      #34233b,
      #291823
    );

  border:
    1px solid #46304b;

  color:
    #eee6ef;

  border-top-right-radius:
    5px;
}


/* =========================
   INPUT AREA
========================= */

.input-area {

  position:
    fixed;

  left: 0;

  right: 0;

  bottom: 0;

  padding:
    16px 6% 20px;

  background:
    linear-gradient(
      to top,
      #070609 70%,
      rgba(7, 6, 9, 0)
    );
}

.input-box {

  width: 90%;

  max-width: 760px;

  margin:
    0 auto;

  display: flex;

  gap: 9px;

  padding: 7px;

  background:
    #0e0b11;

  border:
    1px solid #2b222f;

  border-radius: 14px;

  box-shadow:
    0 8px 30px
    rgba(0, 0, 0, 0.55);
}

.message-input {

  flex: 1;

  min-width: 0;

  padding:
    12px 13px;

  border: none;

  outline: none;

  background:
    transparent;

  color:
    #eee8ef;

  font-family:
    "Quicksand",
    sans-serif;

  font-size: 13px;
}

.message-input::placeholder {

  color:
    #665d69;
}

.send-button {

  padding:
    0 19px;

  border:
    1px solid #49334e;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #3a2641,
      #351d2a
    );

  color:
    #e9e0eb;

  font-family:
    "Quicksand",
    sans-serif;

  font-size: 13px;

  font-weight: 600;

  cursor:
    pointer;
}

.send-button:hover {

  background:
    linear-gradient(
      135deg,
      #4b3053,
      #48202f
    );
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .chat-container {

    width: 88%;
  }

  .bubble {

    max-width: 84%;

    font-size: 13px;
  }

  .input-area {

    padding:
      12px 4% 16px;
  }

  .input-box {

    width: 92%;
  }

  .send-button {

    padding:
      0 15px;
  }
}

</style>

</head>


<body>


<!-- TOP BAR -->

<div class="topbar">

  <a
    class="back"
    href="index.html"
  >
    ← Mori
  </a>

</div>


<!-- CHAT -->

<div class="chat-container">


  <div class="intro">

    <span class="intro-name">
      The Dangerous Lover
    </span>

    A new story begins here.

  </div>


  <div
    class="messages"
    id="messages"
  >


    <!-- AI MESSAGE -->

    <div class="message ai">

      <div class="bubble">
        You finally came.
      </div>

    </div>


    <!-- USER MESSAGE -->

    <div class="message user">

      <div class="bubble">
        Who are you?
      </div>

    </div>


    <!-- AI MESSAGE -->

    <div class="message ai">

      <div class="bubble">
        Someone you probably shouldn't trust.
      </div>

    </div>


  </div>

</div>


<!-- INPUT -->

<div class="input-area">

  <div class="input-box">

    <input
      id="messageInput"
      class="message-input"
      type="text"
      placeholder="Write a message..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      class="send-button"
      type="button"
    >
      Send
    </button>

  </div>

</div>


<script>

const input =
  document.getElementById("messageInput");

const button =
  document.getElementById("sendButton");

const messages =
  document.getElementById("messages");


function sendMessage() {

  const text =
    input.value.trim();

  if (!text) {
    return;
  }


  /* USER MESSAGE */

  const userMessage =
    document.createElement("div");

  userMessage.className =
    "message user";


  const userBubble =
    document.createElement("div");

  userBubble.className =
    "bubble";

  userBubble.textContent =
    text;


  userMessage.appendChild(
    userBubble
  );

  messages.appendChild(
    userMessage
  );


  input.value = "";

  input.focus();


  /*
    TEMPORARY RESPONSE

    现在还没有连接真正的 AI。
    下一步我们会把这里换成
    真正的角色 AI 回复。
  */

  setTimeout(function() {

    const aiMessage =
      document.createElement("div");

    aiMessage.className =
      "message ai";


    const aiBubble =
      document.createElement("div");

    aiBubble.className =
      "bubble";

    aiBubble.textContent =
      "Interesting... tell me more.";


    aiMessage.appendChild(
      aiBubble
    );

    messages.appendChild(
      aiMessage
    );


    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });

  }, 700);

}


button.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);

</script>


</body>

</html>
