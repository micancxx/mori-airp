<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mori · The Dangerous Lover</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(circle at 20% 0%, #382340 0%, transparent 35%),
    radial-gradient(circle at 90% 80%, #321823 0%, transparent 35%),
    #070609;

  color: #eee8ef;

  font-family:
    Arial,
    sans-serif;
}

.topbar {
  padding: 22px 6%;

  border-bottom: 1px solid #251b29;

  background: #09070b;
}

.back {
  color: #a694aa;

  text-decoration: none;

  font-size: 14px;
}

.chat {
  width: 90%;
  max-width: 760px;

  margin: auto;

  padding-bottom: 130px;
}

.intro {
  padding: 40px 0 25px;

  text-align: center;

  color: #776c7b;

  font-size: 13px;
}

.name {
  display: block;

  margin-bottom: 6px;

  color: #d8cadb;

  font-size: 21px;

  font-weight: bold;
}

.message {
  display: flex;

  margin: 16px 0;
}

.ai {
  justify-content: flex-start;
}

.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 75%;

  padding: 13px 16px;

  border-radius: 15px;

  font-size: 14px;

  line-height: 1.6;
}

.ai .bubble {
  background: #130e16;

  border: 1px solid #2c2131;

  color: #d1c5d4;
}

.user .bubble {
  background: #34223b;

  border: 1px solid #4a3150;

  color: #eee6ef;
}

.input-area {
  position: fixed;

  bottom: 0;
  left: 0;
  right: 0;

  padding: 15px;

  background: #08070a;
}

.input-box {
  display: flex;

  gap: 8px;

  width: 90%;
  max-width: 760px;

  margin: auto;
}

input {
  flex: 1;

  min-width: 0;

  padding: 14px;

  border: 1px solid #302435;

  border-radius: 11px;

  outline: none;

  background: #100c12;

  color: white;

  font-size: 14px;
}

input::placeholder {
  color: #6c6270;
}

button {
  padding: 0 20px;

  border: 1px solid #51375a;

  border-radius: 11px;

  background: #34213b;

  color: #eee5f0;

  cursor: pointer;

  font-size: 14px;
}

button:active {
  background: #52345c;
}

</style>

</head>


<body>


<div class="topbar">

  <a
    class="back"
    href="index.html"
  >
    ← Mori
  </a>

</div>


<div class="chat">


  <div class="intro">

    <span class="name">
      The Dangerous Lover
    </span>

    A new story begins here.

  </div>


  <div id="messages">


    <div class="message ai">

      <div class="bubble">
        You finally came.
      </div>

    </div>


    <div class="message user">

      <div class="bubble">
        Who are you?
      </div>

    </div>


    <div class="message ai">

      <div class="bubble">
        Someone you probably shouldn't trust.
      </div>

    </div>


  </div>

</div>


<div class="input-area">

  <div class="input-box">

    <input
      id="messageInput"
      type="text"
      placeholder="Write a message..."
    >

    <button
      id="sendButton"
      type="button"
    >
      Send
    </button>

  </div>

</div>


<script>

function sendMessage() {

  var input = document.getElementById("messageInput");

  var messages = document.getElementById("messages");

  var text = input.value.trim();

  if (!text) {
    return;
  }


  var userMessage = document.createElement("div");

  userMessage.className = "message user";


  var userBubble = document.createElement("div");

  userBubble.className = "bubble";

  userBubble.textContent = text;


  userMessage.appendChild(userBubble);

  messages.appendChild(userMessage);


  input.value = "";

  input.focus();


  setTimeout(function() {

    var aiMessage = document.createElement("div");

    aiMessage.className = "message ai";


    var aiBubble = document.createElement("div");

    aiBubble.className = "bubble";

    aiBubble.textContent =
      "You have my attention.";


    aiMessage.appendChild(aiBubble);

    messages.appendChild(aiMessage);

  }, 600);

}


document.addEventListener(
  "DOMContentLoaded",
  function() {

    document
      .getElementById("sendButton")
      .addEventListener(
        "click",
        sendMessage
      );


    document
      .getElementById("messageInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

          }

        }
      );

  }
);

</script>


</body>

</html>
