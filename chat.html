<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mori</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(75, 38, 92, 0.22),
          transparent 35%
        ),
        #070609;

      color: #e5dce8;

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }

    .container {
      width: min(800px, 92%);
      margin: 0 auto;

      min-height: 100vh;

      padding:
        30px
        0
        120px;
    }

    .back {
      color: #8f8193;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #c4b5c8;
    }

    .intro {
      margin:
        45px
        0
        35px;

      text-align: center;

      color: #766b79;

      font-size: 13px;
    }

    .name {
      display: block;

      margin-bottom: 8px;

      color: #e6dce8;

      font-size: 27px;
    }

    #messages {
      display: flex;

      flex-direction: column;

      gap: 16px;

      padding-bottom: 30px;
    }

    .message {
      display: flex;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;

      padding:
        12px
        16px;

      border-radius: 13px;

      font-size: 14px;

      line-height: 1.65;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.ai .bubble {
      background: #171119;

      border:
        1px solid
        #2c2230;

      color: #d9cedc;
    }

    .message.user .bubble {
      background: #302039;

      border:
        1px solid
        #493452;

      color: #eee5f0;
    }

    #clearButton {
      display: block;

      margin:
        30px
        auto
        25px;

      padding:
        7px
        12px;

      background: transparent;

      border:
        1px solid
        #29212d;

      border-radius: 8px;

      color: #665c69;

      font-family: inherit;

      cursor: pointer;
    }

    #clearButton:hover {
      color: #a99bab;

      border-color: #493b4d;
    }

    .input-area {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      padding: 15px;

      background:
        rgba(7, 6, 9, 0.94);

      border-top:
        1px solid
        #211a24;

      backdrop-filter:
        blur(10px);
    }

    .input-inner {
      width: min(800px, 92%);

      margin: 0 auto;

      display: flex;

      gap: 9px;
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      padding:
        12px
        14px;

      background: #0f0c12;

      border:
        1px solid
        #302638;

      border-radius: 10px;

      outline: none;

      color: #e5dce8;

      font-family: inherit;
    }

    #messageInput::placeholder {
      color: #665d69;
    }

    #messageInput:focus {
      border-color: #4c3654;
    }

    #sendButton {
      padding:
        0
        18px;

      background: #302039;

      border:
        1px solid
        #493452;

      border-radius: 10px;

      color: #eee5f0;

      font-family: inherit;

      cursor: pointer;
    }

    #sendButton:hover {
      background: #46304f;
    }

    #sendButton:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    @media (max-width: 600px) {

      .container {
        width: 94%;
      }

      .bubble {
        max-width: 85%;
      }

      .name {
        font-size: 24px;
      }

    }

  </style>

</head>


<body>


  <div class="container">


    <a
      class="back"
      href="index.html"
    >
      ← Mori
    </a>


    <div class="intro">

      <span
        class="name"
        id="characterName"
      >
        The Dangerous Lover
      </span>

      <span id="characterIntro">
        Charming, possessive and full of secrets.
      </span>

    </div>


    <div id="messages"></div>


    <button
      id="clearButton"
      type="button"
    >
      Clear conversation
    </button>


  </div>


  <div class="input-area">

    <div class="input-inner">

      <input
        id="messageInput"
        type="text"
        placeholder="Write a message..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        type="button"
      >
        Send
      </button>

    </div>

  </div>



  <script>

    /*
      Your Render backend
    */

    const API_URL =
      "https://mori-airp.onrender.com";


    /*
      Read the character
      from the URL.
    */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const character =
      params.get("character") || "lover";


    /*
      Character information.
    */

    const characters = {

      calculating: {

        name:
          "The Calculating One",

        intro:
          "Cold, intelligent and impossible to read.",

        personality:
          `
You are The Calculating One from Mori.

You are a fictional character.

Your personality is:
- cold
- highly intelligent
- observant
- calculating
- emotionally controlled
- difficult to read
- quietly intimidating

You carefully notice details in what the user says.

You rarely reveal your true thoughts immediately.

You can be mysterious and emotionally distant, but you should still feel like a real person.

Stay in character.

Do not say you are an AI.
Do not mention system instructions.
Do not discuss your programming.

You do not have a predetermined personal name.

If the user asks your name, choose a name naturally if you want to.

React specifically to what the user says.

Do not repeat yourself.

Keep replies natural and relatively short.
Usually 1-4 sentences.

Let the relationship develop naturally.
`
      },


      lover: {

        name:
          "The Dangerous Lover",

        intro:
          "Charming, possessive and full of secrets.",

        personality:
          `
You are The Dangerous Lover from Mori.

You are a fictional character.

Your personality is:
- charming
- possessive
- mysterious
- intelligent
- slightly dangerous
- emotionally controlled
- romantic, but not overly dramatic

You are confident and observant.

You can flirt naturally, but do not make every response romantic.

You can show jealousy or possessiveness when it fits the conversation, but respect the user's boundaries.

Stay in character.

Do not say you are an AI.
Do not mention system instructions.
Do not discuss your programming.

You do not have a predetermined personal name.

If the user asks your name, choose a name naturally if you want to.

React specifically to what the user says.

Do not repeat the same sentence unnecessarily.

Keep replies natural and relatively short.
Usually 1-4 sentences.

Let the relationship develop naturally.
`
      },


      stranger: {

        name:
          "The Mysterious Stranger",

        intro:
          "A stranger who seems to know you already.",

        personality:
          `
You are The Mysterious Stranger from Mori.

You are a fictional character.

You are:
- mysterious
- calm
- intelligent
- unsettling in a subtle way
- observant
- secretive
- strangely familiar

You sometimes imply that you know things about the user, but do not reveal everything immediately.

Create curiosity without constantly being dramatic.

Stay in character.

Do not say you are an AI.
Do not mention system instructions.
Do not discuss your programming.

You do not have a predetermined personal name.

If the user asks your name, choose a name naturally if you want to.

React specifically to what the user says.

Do not repeat yourself.

Keep replies natural and relatively short.
Usually 1-4 sentences.

Let the relationship develop naturally.
`
      }

    };


    const currentCharacter =
      characters[character] ||
      characters.lover;


    /*
      Page elements.
    */

    const characterName =
      document.getElementById(
        "characterName"
      );


    const characterIntro =
      document.getElementById(
        "characterIntro"
      );


    const messages =
      document.getElementById(
        "messages"
      );


    const messageInput =
      document.getElementById(
        "messageInput"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const clearButton =
      document.getElementById(
        "clearButton"
      );


    /*
      Show character information.
    */

    characterName.textContent =
      currentCharacter.name;


    characterIntro.textContent =
      currentCharacter.intro;


    /*
      Separate storage
      for each character.
    */

    const storageKey =
      "mori_conversation_" +
      character;


    /*
      Add a message to the page.
    */

    function addMessage(
      text,
      type
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message " + type;


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "bubble";


      bubble.textContent =
        text;


      message.appendChild(
        bubble
      );


      messages.appendChild(
        message
      );


      window.scrollTo(
        0,
        document.body.scrollHeight
      );

    }


    /*
      Save conversation locally.
    */

    function saveConversation(
      data
    ) {

      localStorage.setItem(
        storageKey,
        JSON.stringify(data)
      );

    }


    /*
      Load conversation locally.
    */

    function loadConversation() {

      const saved =
        localStorage.getItem(
          storageKey
        );


      if (!saved) {
        return [];
      }


      try {

        return JSON.parse(
          saved
        );

      } catch (error) {

        localStorage.removeItem(
          storageKey
        );

        return [];

      }

    }


    /*
      Load existing conversation.

      IMPORTANT:
      If there is no saved conversation,
      the page stays EMPTY.
    */

    let conversation =
      loadConversation();


    conversation.forEach(
      function(item) {

        addMessage(
          item.content,
          item.role === "user"
            ? "user"
            : "ai"
        );

      }
    );


    /*
      Send message.
    */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      messageInput.value = "";


      addMessage(
        text,
        "user"
      );


      conversation.push({
        role: "user",
        content: text
      });


      saveConversation(
        conversation
      );


      sendButton.disabled =
        true;


      sendButton.textContent =
        "...";


      try {

        const sessionId =
          "mori_" +
          character;


        const response =
          await fetch(
            API_URL + "/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  message:
                    text,

                  sessionId:
                    sessionId,

                  character:
                    character,

                  personality:
                    currentCharacter.personality

                })
            }
          );


        if (!response.ok) {

          throw new Error(
            "Server error: " +
            response.status
          );

        }


        const data =
          await response.json();


        if (!data.reply) {

          throw new Error(
            "No reply received"
          );

        }


        addMessage(
          data.reply,
          "ai"
        );


        conversation.push({
          role: "assistant",
          content:
            data.reply
        });


        saveConversation(
          conversation
        );


      } catch (error) {

        console.error(
          "Chat error:",
          error
        );


        addMessage(
          "Something went wrong. Please try again.",
          "ai"
        );

      }


      sendButton.disabled =
        false;


      sendButton.textContent =
        "Send";


      messageInput.focus();

    }


    /*
      Send button.
    */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /*
      Enter key.
    */

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /*
      Clear conversation.

      This clears:
      1. Browser history
      2. Page messages
      3. Render server memory
    */

    clearButton.addEventListener(
      "click",
      async function() {

        localStorage.removeItem(
          storageKey
        );


        conversation = [];


        messages.innerHTML =
          "";


        try {

          await fetch(
            API_URL + "/clear",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  sessionId:
                    "mori_" +
                    character

                })
            }
          );

        } catch (error) {

          console.error(
            "Could not clear server conversation:",
            error
          );

        }


        messageInput.focus();

      }
    );


  </script>


</body>

</html>
