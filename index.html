<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mori</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0d0f;
      color: #eee;
      font-family:
        Georgia,
        "Times New Roman",
        "Noto Serif SC",
        serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 26px 7%;
      border-bottom: 1px solid #242429;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 25px;
      letter-spacing: 1px;
      color: #f5f2ee;
      white-space: nowrap;
    }

    .logo-symbol {
      color: #c8a98a;
      font-size: 28px;
    }

    .search {
      flex: 1;
      max-width: 420px;
      margin-left: auto;

      padding: 12px 17px;

      border: 1px solid #303037;
      border-radius: 30px;

      outline: none;

      background: #151519;
      color: #eee;

      font-family: inherit;
      font-size: 14px;
    }

    .search::placeholder {
      color: #77777f;
    }

    .search:focus {
      border-color: #67584d;
    }

    .login-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #googleLogin,
    #logoutButton {
      border: 1px solid #3b3b43;
      border-radius: 25px;

      padding: 11px 18px;

      background: #17171b;
      color: #eee;

      cursor: pointer;

      font-family: inherit;

      white-space: nowrap;

      transition: 0.2s;
    }

    #googleLogin:hover,
    #logoutButton:hover {
      background: #242429;
      border-color: #77716b;
    }

    #googleLogin:disabled,
    #logoutButton:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #userInfo {
      display: none;
      align-items: center;
      gap: 9px;

      color: #aaa;
      font-size: 13px;
    }

    #userAvatar {
      width: 32px;
      height: 32px;

      border-radius: 50%;

      object-fit: cover;

      border: 1px solid #444;

      display: none;
    }

    #userName {
      color: #eee;
    }

    /* =========================
       TITLE
    ========================= */

    .title {
      text-align: center;

      padding: 70px 20px 45px;
    }

    .title h1 {
      margin: 0 0 14px;

      font-size: 34px;
      font-weight: normal;

      letter-spacing: 0.3px;
    }

    .title p {
      margin: 0;

      color: #898990;

      font-size: 15px;
    }


    /* =========================
       CHARACTERS
    ========================= */

    .characters {

      width: 86%;
      max-width: 1100px;

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 24px;
    }


    .card {

      overflow: hidden;

      border: 1px solid #29292f;
      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          #151519,
          #101012
        );

      text-align: center;

      transition:
        transform 0.25s,
        border-color 0.25s,
        box-shadow 0.25s;
    }


    .card:hover {

      transform: translateY(-5px);

      border-color: #49434a;

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.3);
    }


    /* =========================
       CHARACTER IMAGE
    ========================= */

    .character-image-wrapper {

      width: 100%;
      height: 245px;

      overflow: hidden;

      background: #111114;
    }


    .character-image {

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center 20%;

      display: block;

      transition: transform 0.4s ease;
    }


    .card:hover
    .character-image {

      transform: scale(1.035);

    }


    .card-content {

      padding: 25px 25px 28px;

    }


    .card h3 {

      margin: 0 0 15px;

      font-size: 22px;

      font-weight: normal;

      color: #f1ece7;
    }


    .tags {

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 22px;

    }


    .tag {

      padding: 6px 11px;

      border: 1px solid #39353a;

      border-radius: 20px;

      color: #99949a;

      font-size: 11px;

      background: #141417;
    }


    .chat-button {

      display: inline-block;

      padding: 10px 24px;

      border: 1px solid #514a4c;

      border-radius: 25px;

      color: #eee;

      text-decoration: none;

      font-size: 13px;

      transition: 0.2s;
    }


    .chat-button:hover {

      background: #242126;

      border-color: #8b7667;

    }


    /* =========================
       CATEGORIES
    ========================= */

    .categories {

      width: 86%;
      max-width: 1100px;

      margin: 45px auto 0;

      display: flex;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;
    }


    .category {

      padding: 8px 16px;

      border: 1px solid #29292f;

      border-radius: 20px;

      color: #77777f;

      font-size: 12px;
    }


    footer {

      padding: 55px 20px 30px;

      text-align: center;

      color: #55555c;

      font-size: 12px;
    }


    @media (max-width: 800px) {

      header {

        flex-wrap: wrap;

        padding: 22px 6%;
      }


      .search {

        order: 3;

        width: 100%;

        max-width: none;

        margin-left: 0;
      }


      .login-area {

        margin-left: auto;
      }


      .title {

        padding-top: 55px;
      }


      .title h1 {

        font-size: 28px;
      }


      .characters {

        grid-template-columns: 1fr;

        width: 90%;

        max-width: 500px;
      }


      .character-image-wrapper {

        height: 300px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <div class="logo">

      <span class="logo-symbol">
        𓆱
      </span>

      <span>
        Mori
      </span>

    </div>


    <input
      class="search"
      type="text"
      placeholder="Search characters..."
      id="searchInput"
      autocomplete="off"
    >


    <div class="login-area">

      <button
        id="googleLogin"
        type="button"
      >
        Continue with Google
      </button>


      <div id="userInfo">

        <img
          id="userAvatar"
          src=""
          alt=""
        >

        <span id="userName">
          Signed in
        </span>

      </div>


      <button
        id="logoutButton"
        type="button"
        style="display:none;"
      >
        Sign out
      </button>

    </div>

  </header>



  <!-- TITLE -->

  <section class="title">

    <h1>
      Choose someone to talk to.
    </h1>

    <p>
      Every story begins with a conversation.
    </p>

  </section>



  <!-- CHARACTERS -->

  <section
    class="characters"
    id="characters"
  >


    <!-- 夏亦谦 -->

    <div
      class="card"
      data-name="夏亦谦"
    >

      <div class="character-image-wrapper">

        <img
          class="character-image"
          src="https://f2.zxgjw.com/i/2026/08/14/k0odpx.jpeg"
          alt="夏亦谦"
        >

      </div>


      <div class="card-content">

        <h3>
          夏亦谦
        </h3>


        <div class="tags">

          <span class="tag">
            医生
          </span>

          <span class="tag">
            温和
          </span>

          <span class="tag">
            克制
          </span>

          <span class="tag">
            纯爱
          </span>

        </div>


        <a
          class="chat-button"
          href="chat.html?character=xiayiqian"
        >
          Start Chat
        </a>

      </div>

    </div>


  </section>



  <!-- CATEGORIES -->

  <div class="categories">

    <div class="category">
      Romance
    </div>

    <div class="category">
      Dark
    </div>

    <div class="category">
      Mystery
    </div>

    <div class="category">
      Fantasy
    </div>

  </div>



  <footer>

    Mori · A place where stories live.

  </footer>



  <script>


    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://luidkakxsmmrpnsoycof.supabase.co";


    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1aWRrYWt4c21tcnBuc295Y29mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTgzNjEsImV4cCI6MjEwMjA3NDM2MX0.DeRQ5cRPaBfb3ex6nFMhJqOnX_3gLcTugZH6zBxoxVg";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            flowType: "implicit",
            detectSessionInUrl: true,
            persistSession: true,
            autoRefreshToken: true
          }
        }
      );


    /* =========================
       ELEMENTS
    ========================= */

    const googleLogin =
      document.getElementById(
        "googleLogin"
      );


    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    const userInfo =
      document.getElementById(
        "userInfo"
      );


    const userName =
      document.getElementById(
        "userName"
      );


    const userAvatar =
      document.getElementById(
        "userAvatar"
      );


    /* =========================
       LOGIN DISPLAY
    ========================= */

    function showLoggedInUser(session) {

      if (
        !session ||
        !session.user
      ) {

        googleLogin.style.display =
          "inline-block";

        userInfo.style.display =
          "none";

        logoutButton.style.display =
          "none";

        return;

      }


      const user =
        session.user;


      const metadata =
        user.user_metadata || {};


      const name =
        metadata.full_name ||
        metadata.name ||
        user.email ||
        "User";


      userName.textContent =
        "Hi, " + name;


      if (metadata.avatar_url) {

        userAvatar.src =
          metadata.avatar_url;

        userAvatar.style.display =
          "block";

      }


      googleLogin.style.display =
        "none";

      userInfo.style.display =
        "flex";

      logoutButton.style.display =
        "inline-block";

    }


    /* =========================
       CLEAN URL
    ========================= */

    function cleanAuthHash() {

      if (
        window.location.hash
          .includes("access_token")
      ) {

        const cleanUrl =
          window.location.origin +
          window.location.pathname +
          window.location.search;


        window.history.replaceState(
          null,
          document.title,
          cleanUrl
        );

      }

    }


    /* =========================
       SESSION
    ========================= */

    async function updateLoginState() {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .getSession();


      if (error) {

        console.error(
          error
        );

        return;

      }


      if (
        data &&
        data.session
      ) {

        showLoggedInUser(
          data.session
        );

        cleanAuthHash();

      } else {

        showLoggedInUser(
          null
        );

      }

    }


    /* =========================
       GOOGLE LOGIN
    ========================= */

    googleLogin.addEventListener(
      "click",
      async () => {

        googleLogin.disabled =
          true;

        googleLogin.textContent =
          "Connecting...";


        const redirectTo =
          window.location.origin +
          window.location.pathname;


        const {
          error
        } =
          await supabaseClient.auth
            .signInWithOAuth({

              provider: "google",

              options: {

                redirectTo:
                  redirectTo

              }

            });


        if (error) {

          alert(
            "Google login failed:\n\n" +
            error.message
          );


          googleLogin.disabled =
            false;

          googleLogin.textContent =
            "Continue with Google";

        }

      }
    );


    /* =========================
       LOGOUT
    ========================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        await supabaseClient.auth
          .signOut();

        await updateLoginState();

      }
    );


    supabaseClient.auth
      .onAuthStateChange(
        (
          event,
          session
        ) => {

          showLoggedInUser(
            session
          );

          if (session) {

            cleanAuthHash();

          }

        }
      );


    /* =========================
       SEARCH
    ========================= */

    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const cards =
      document.querySelectorAll(
        ".card"
      );


    searchInput.addEventListener(
      "input",
      () => {

        const search =
          searchInput.value
            .toLowerCase()
            .trim();


        cards.forEach(
          (card) => {

            const name =
              card.dataset.name
                .toLowerCase();


            card.style.display =
              name.includes(search)
                ? ""
                : "none";

          }
        );

      }
    );


    /* =========================
       START
    ========================= */

    updateLoginState();

  </script>


</body>

</html>
