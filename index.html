<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mori</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;

      background: #0d0d0f;
      color: #eee;

      font-family:
        Georgia,
        "Times New Roman",
        "Noto Serif SC",
        serif;
    }


    header {

      display: flex;
      align-items: center;

      gap: 20px;

      padding: 24px 7%;

      border-bottom:
        1px solid #242429;

    }


    .logo {

      display: flex;
      align-items: center;

      gap: 9px;

      font-size: 25px;

      letter-spacing: 1px;

      color: #f5f2ee;

      white-space: nowrap;

    }


    .logo-symbol {

      color: #c8a98a;

      font-size: 28px;

    }


    .search {

      flex: 1;

      max-width: 420px;

      margin-left: auto;

      padding: 11px 17px;

      border:
        1px solid #303037;

      border-radius: 30px;

      outline: none;

      background: #151519;

      color: #eee;

      font-family: inherit;

    }


    .search::placeholder {
      color: #66666e;
    }


    .login-area {

      display: flex;
      align-items: center;

      gap: 10px;

    }


    #googleLogin,
    #logoutButton {

      border:
        1px solid #3b3b43;

      border-radius: 25px;

      padding: 10px 17px;

      background: #17171b;

      color: #eee;

      cursor: pointer;

      font-family: inherit;

      white-space: nowrap;

    }


    #googleLogin:hover,
    #logoutButton:hover {

      background: #242429;

    }


    #userInfo {

      display: none;

      align-items: center;

      gap: 8px;

      color: #aaa;

      font-size: 13px;

    }


    #userAvatar {

      width: 31px;
      height: 31px;

      border-radius: 50%;

      object-fit: cover;

    }


    #userName {
      color: #eee;
    }



    /* =========================
       TITLE
    ========================= */

    .title {

      text-align: center;

      padding:
        65px 20px 40px;

    }


    .title h1 {

      margin: 0 0 13px;

      font-size: 32px;

      font-weight: normal;

    }


    .title p {

      margin: 0;

      color: #77777f;

      font-size: 14px;

    }



    /* =========================
       CHARACTER CARD
    ========================= */

    .characters {

      width: 90%;

      max-width: 1050px;

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 22px;

    }


    .card {

      overflow: hidden;

      border:
        1px solid #29292f;

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          #151519,
          #101012
        );

      transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;

    }


    .card:hover {

      transform:
        translateY(-5px);

      border-color:
        #514a50;

      box-shadow:
        0 18px 45px
        rgba(0,0,0,.35);

    }


    .card-image {

      width: 100%;

      height: 285px;

      object-fit: cover;

      object-position:
        center 22%;

      display: block;

      filter:
        brightness(.91);

    }


    .card-content {

      padding:
        22px 22px 23px;

      text-align: center;

    }


    .card h3 {

      margin:
        0 0 12px;

      font-size: 21px;

      font-weight: normal;

    }


    .tags {

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 20px;

    }


    .tag {

      padding:
        5px 10px;

      border:
        1px solid #36333a;

      border-radius: 20px;

      color: #8e898e;

      font-size: 11px;

    }


    .chat-button {

      display: inline-block;

      padding:
        10px 25px;

      border:
        1px solid #51484d;

      border-radius: 25px;

      color: #eee;

      text-decoration: none;

      font-size: 13px;

      transition: .2s;

    }


    .chat-button:hover {

      background: #252125;

      border-color:
        #8a7565;

    }



    /* =========================
       FOOTER
    ========================= */

    footer {

      padding:
        60px 20px 30px;

      text-align: center;

      color: #55555c;

      font-size: 12px;

    }



    @media (max-width: 800px) {

      header {

        flex-wrap: wrap;

        padding: 20px 6%;

      }


      .search {

        order: 3;

        width: 100%;

        max-width: none;

        margin-left: 0;

      }


      .login-area {

        margin-left: auto;

      }


      .title {

        padding-top: 50px;

      }


      .characters {

        grid-template-columns: 1fr;

        max-width: 430px;

      }


      .card-image {

        height: 340px;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="logo">

    <span class="logo-symbol">
      𓆱
    </span>

    <span>
      Mori
    </span>

  </div>


  <input
    class="search"
    id="searchInput"
    type="text"
    placeholder="Search characters..."
    autocomplete="off"
  >


  <div class="login-area">

    <button
      id="googleLogin"
      type="button"
    >
      Continue with Google
    </button>


    <div id="userInfo">

      <img
        id="userAvatar"
        src=""
        alt=""
      >

      <span id="userName">
        Signed in
      </span>

    </div>


    <button
      id="logoutButton"
      type="button"
      style="display:none;"
    >
      Sign out
    </button>

  </div>

</header>



<section class="title">

  <h1>
    Choose someone to talk to.
  </h1>

  <p>
    Every story begins with a conversation.
  </p>

</section>



<section
  class="characters"
  id="characters"
>


  <!-- 夏亦谦 -->

  <div
    class="card"
    data-name="夏亦谦"
  >

    <img
      class="card-image"
      src="xia-yiqian.jpg"
      alt="夏亦谦"
    >


    <div class="card-content">

      <h3>
        夏亦谦
      </h3>


      <div class="tags">

        <span class="tag">
          bg
        </span>

        <span class="tag">
          洁
        </span>

        <span class="tag">
          纯爱
        </span>

        <span class="tag">
          st
        </span>

        <span class="tag">
          限左
        </span>

      </div>


      <a
        class="chat-button"
        href="chat.html?character=xiayiqian"
      >
        Start Chat
      </a>

    </div>

  </div>


</section>



<footer>

  Mori · A place where stories live.

</footer>



<script>


/* =========================
   SUPABASE
========================= */


const SUPABASE_URL =
  "https://luidkakxsmmrpnsoycof.supabase.co";


const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFub24iLCJpYXQiOjE3ODY0OTgzNjEsImV4cCI6MjEwMjA3NDM2MX0.DeRQ5cRPaBfb3ex6nFMhJqOnX_3gLcTugZH6zBxoxVg";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        flowType: "implicit",

        detectSessionInUrl: true,

        persistSession: true,

        autoRefreshToken: true
      }
    }
  );



/* =========================
   ELEMENTS
========================= */


const googleLogin =
  document.getElementById(
    "googleLogin"
  );


const logoutButton =
  document.getElementById(
    "logoutButton"
  );


const userInfo =
  document.getElementById(
    "userInfo"
  );


const userName =
  document.getElementById(
    "userName"
  );


const userAvatar =
  document.getElementById(
    "userAvatar"
  );


const searchInput =
  document.getElementById(
    "searchInput"
  );


const cards =
  document.querySelectorAll(
    ".card"
  );



/* =========================
   USER
========================= */


function showLoggedInUser(session) {

  if (
    !session ||
    !session.user
  ) {

    googleLogin.style.display =
      "inline-block";

    userInfo.style.display =
      "none";

    logoutButton.style.display =
      "none";

    return;

  }


  const user =
    session.user;


  const metadata =
    user.user_metadata || {};


  const name =
    metadata.full_name ||
    metadata.name ||
    user.email ||
    "User";


  userName.textContent =
    "Hi, " + name;


  if (
    metadata.avatar_url
  ) {

    userAvatar.src =
      metadata.avatar_url;

    userAvatar.style.display =
      "block";

  }


  googleLogin.style.display =
    "none";

  userInfo.style.display =
    "flex";

  logoutButton.style.display =
    "inline-block";

}



/* =========================
   CLEAN AUTH URL
========================= */


function cleanAuthHash() {

  if (
    window.location.hash
      .includes("access_token")
  ) {

    const cleanUrl =
      window.location.origin +
      window.location.pathname +
      window.location.search;


    window.history.replaceState(
      null,
      document.title,
      cleanUrl
    );

  }

}



/* =========================
   SESSION
========================= */


async function updateLoginState() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if (error) {

    console.error(
      "Session error:",
      error
    );

    return;

  }


  if (
    data &&
    data.session
  ) {

    showLoggedInUser(
      data.session
    );

    cleanAuthHash();

  } else {

    showLoggedInUser(
      null
    );

  }

}



/* =========================
   GOOGLE
========================= */


googleLogin.addEventListener(
  "click",
  async () => {

    googleLogin.disabled =
      true;

    googleLogin.textContent =
      "Connecting...";


    const redirectTo =
      window.location.origin +
      window.location.pathname;


    const {
      error
    } =
      await supabaseClient.auth
        .signInWithOAuth({

          provider: "google",

          options: {

            redirectTo:
              redirectTo

          }

        });


    if (error) {

      alert(
        "Google login failed:\n\n" +
        error.message
      );


      googleLogin.disabled =
        false;

      googleLogin.textContent =
        "Continue with Google";

    }

  }
);



/* =========================
   SIGN OUT
========================= */


logoutButton.addEventListener(
  "click",
  async () => {

    await supabaseClient.auth
      .signOut();

    await updateLoginState();

  }
);



/* =========================
   SEARCH
========================= */


searchInput.addEventListener(
  "input",
  () => {

    const search =
      searchInput.value
        .toLowerCase()
        .trim();


    cards.forEach(card => {

      const name =
        card.dataset.name
          .toLowerCase();


      card.style.display =
        name.includes(search)
          ? ""
          : "none";

    });

  }
);



/* =========================
   START
========================= */


updateLoginState();

</script>


</body>

</html>
